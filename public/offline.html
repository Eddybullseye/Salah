<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline • Salah Companion</title>
  <style>
    body {
      background-color: #022c22;
      color: #ecfdf5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      box-sizing: border-box;
      text-align: center;
    }
    .card {
      background: #042f2e;
      border: 1px solid rgba(245, 158, 11, 0.4);
      border-radius: 24px;
      padding: 32px 24px;
      max-width: 420px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }
    .icon { font-size: 48px; margin-bottom: 16px; }
    h1 { font-size: 22px; margin: 0 0 8px 0; color: #ffffff; }
    p { font-size: 14px; color: #a7f3d0; line-height: 1.5; margin: 0 0 24px 0; }
    .btn {
      background: linear-gradient(to right, #f59e0b, #d97706);
      color: #022c22;
      font-weight: bold;
      padding: 12px 24px;
      border-radius: 12px;
      text-decoration: none;
      display: inline-block;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🌙</div>
    <h1>You are Currently Offline</h1>
    <p>Salah Companion calculates prayer times and plays adhan completely offline. Tap below to reload your saved dashboard.</p>
    <a href="/" class="btn">Reload Salah Companion</a>
  </div>
</body>
</html>
